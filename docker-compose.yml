services:
  erpsoft:
    mem_limit: 2048m
    mem_reservation: 512M
    build: 
      context: ./
      dockerfile: './Dockerfile.server'
    container_name: 'erpsoft-8.3'
    restart: 'always'
    ports:
      - 8002:80
    links: 
      - laravelcmsdatabase
    volumes: 
      - ./app:/var/www/html
      - ./docker-config:/etc/apache2/sites-enabled
      - ./docker-config/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
  laravelcmsdatabase:
    mem_limit: 1024m
    mem_reservation: 128M
    build:
      context: "./"
      dockerfile: 'Dockerfile.db'
    container_name: 'erpsoft'
    restart: 'always'
    ports:
      - "3304:3306"
    volumes: 
      - ./docker/data/mysql:/var/lib/mysql
      - ./docker/logs/mysql:/var/log/mysql
      - ./docker-config/database/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: adfg245425245dfadfadf
      MYSQL_DATABASE: erpsoft
      MYSQL_USER: erpsoft
      MYSQL_PASSWORD: adfg245425245dfadfadf
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    mem_limit: 64m
    restart: 'always'
    mem_reservation: 32M
    container_name: 'erpsoft-phpmyadmin'
    links:
      - laravelcmsdatabase
    environment:
      PMA_HOST: laravelcmsdatabase
      PMA_PORT: 3306
      UPLOAD_LIMIT: 1000000
    ports:
      - '3310:80'
  redis:
    container_name: 'erpsoft-redis'
    image: redis:8.4.0
    restart: 'always'
    mem_limit: 64m
    mem_reservation: 32M
    ports:
      - "6380:6379"
  scheduler:
    container_name: 'erpsoft-scheduler'
    mem_limit: 256m
    mem_reservation: 64M
    build:
      context: .
      dockerfile: Dockerfile.server
    command: >
      sh -c "
      while [ ! -f storage/app/private/erp.installed ]; do
        echo 'Waiting for ERP installation...';
        sleep 10;
      done;
      echo 'Start schedule';
      php artisan schedule:work
      "
    restart: unless-stopped
    depends_on:
      - erpsoft
    volumes: 
      - ./app:/var/www/html
      - ./docker-config:/etc/apache2/sites-enabled
      - ./docker-config/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
  queue:
    container_name: 'erpsoft-queue'
    mem_limit: 256m
    mem_reservation: 64M
    build:
      context: .
      dockerfile: Dockerfile.server
    command: >
      sh -c "
      while [ ! -f storage/app/private/erp.installed ]; do
        echo 'Waiting for ERP installation...';
        sleep 10;
      done;
      echo 'Start queue';
      php artisan queue:work --sleep=3 --tries=3
      "
    restart: unless-stopped
    depends_on:
      - erpsoft
    volumes: 
      - ./app:/var/www/html
      - ./docker-config:/etc/apache2/sites-enabled
      - ./docker-config/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
